{% include 'layout.html' %}
<div class="container">
    <div class="card text-center">
        <div class="card-header">
            List of all users
        </div>
        <div class="card-body">
            <h5 class="card-title">List all users</h5>
            <p class="card-text">
                Information regarding users!
            </p>
            <table class="table table-header">
                <thead>
                    <tr>
                        <th scope="col">#</th>
                        <th scope="col">Username</th>
                        <th scope="col">Email</th>
                        <th scope="col">Role</th>
                        <th scope="col">Is active</th>
                        <th scope="col">Actions</th>
                    </tr>
                </thead>
                <tbody>
                    {% for user in users %}
                    <tr class="pointers" >
                        <td> {{loop.index}} </td>
                        <td> {{user.username}} </td>
                        <td> {{user.email}} </td>
                        <td> {{user.role}} </td>
                        <td> {{user.is_active}} </td>
                        <td>
                            <a href="/admin/edit-user-page/{{user.id}}" class="btn btn-info">Edit</a>
                        </td>
                    </tr>
                    {% endfor %}
                </tbody>
            </table>
        </div>
    </div>
</div>
