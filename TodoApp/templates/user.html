{% include 'layout.html' %}
<div class="container">
    <div class="card text-center">
        <div class="card-header">
            <h3>Hello, {{ user.get("user") }}{% if is_admin %}, you are editing {{ user_data.username }}{% endif %}!
            </h3>
        </div>
        <div class="card-body">
            <div class="card-body">
            <form id="editUserForm" data-is-admin="{{ 'true' if is_admin else 'false' }}">
                {% if is_admin %}
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="username">Username</label>
                        <input type="text" value="{{ user_data.username }}" class="form-control" id="username" name="username" required>
                    </div>
                    <div class="form-group col-md-3">
                        <label for="role">Role</label>
                        <select class="form-control" id="role" name="role" required>
                            <option value="user" {% if user_data.role == "user" %}selected{% endif %}>User</option>
                            <option value="admin" {% if user_data.role == "admin" %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                    <div class="form-group col-md-3 ">
                        <label for="is_active">Is Active</label>
                        <input type="checkbox" value="{{ user_data.is_active }}"  id="is_active" name="is_active" {% if user_data.is_active %} checked {% endif %}>
                    </div>
                </div>
                {% endif %}
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="first_name">First Name</label>
                        <input type="text" value="{{ user_data.first_name }}" class="form-control"  name="first_name" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="last_name">Last Name</label>
                        <input type="text" value="{{ user_data.last_name }}" class="form-control"  name="last_name" required>
                    </div>
                </div>
                <div class="form-row">
                    <div class="form-group col-md-6">
                        <label for="email">Email</label>
                        <input type="email" value="{{ user_data.email }}" class="form-control" id="email" name="email" autocomplete="email" required>
                    </div>
                    <div class="form-group col-md-6">
                        <label for="phone_number">Phone Number</label>
                        <input type="tel" value="{{ user_data.phone_number }}" class="form-control" id="phone_number" name="phone_number" required>
                    </div>
                </div>
                <button type="submit" class="btn btn-primary">Save changes</button>
                <button type="button" class="btn btn-info" id="toggleChangePasswordForm" aria-controls="toggleChangePasswordForm" aria-expanded="false">
                    Change Password
                </button>
                <!-- <a href="change-password-page" class="btn btn-secondary">Change password!</a> -->
                <a href="{{ return_url }}" class="btn btn-success">Back</a>
            </form>
            <div class="card-body">
                <form id="changePasswordForm" hidden>
                    <div class="form-row">
                        <div class="form-group col">
                            <label>Password</label>
                            <input type="password" class="form-control" name="password" autocomplete="password" required>
                        </div>
                    </div>
                    <div class="form-row">
                        <div class="form-group col"">
                            <label>New Password</label>
                            <input type="password" class="form-control" name="password1" autocomplete="new-password" required>
                        </div>
                        <div class="form-group col"">
                            <label>Confirm Password</label>
                            <input type="password" class="form-control" name="password2" autocomplete="new-password" required>
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary">Change</button> 
                </form>
            </div>
        </div>
    </div>
</div>
